<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Mijares (Ávila)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>

    :root{
      --accent:#5eead4;
      --bg:#071018;
      --glass:rgba(16,24,36,.45);
      --text:#f8fafc;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      height:100%;
      margin:0;
      overflow:hidden;
      font-family:Inter,system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .shell{
      position:relative;
      width:100%;
      height:100vh;
    }

    #map{
      position:absolute;
      inset:0;
      z-index:1;
    }

    .overlay{
      position:absolute;
      inset:0;
      z-index:10;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:18px;
      pointer-events:none;
    }

    .overlay::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;

      background:
      linear-gradient(
      to bottom,
      rgba(0,0,0,.65),
      transparent 26%,
      transparent 68%,
      rgba(0,0,0,.75)
      );
    }

    .card{
      pointer-events:auto;

      backdrop-filter:blur(30px);
      -webkit-backdrop-filter:blur(30px);

      background:var(--glass);

      border:1px solid rgba(255,255,255,.1);

      border-radius:28px;

      padding:20px;

      box-shadow:
      0 20px 60px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.08);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
    }

    .eyebrow{
      margin:0 0 8px;
      color:var(--accent);
      font-size:.75rem;
      letter-spacing:.14em;
      text-transform:uppercase;
      font-weight:800;
    }

    .title{
      margin:0;
      font-size:1.9rem;
      line-height:1;
      font-weight:900;
      letter-spacing:-0.04em;
    }

    .subtitle{
      margin-top:10px;
      color:rgba(255,255,255,.75);
      line-height:1.5;
      max-width:280px;
    }

    .badge{
      display:flex;
      align-items:center;
      justify-content:center;

      padding:10px 14px;

      border-radius:999px;

      font-weight:700;
      font-size:.85rem;

      color:var(--accent);

      background:rgba(94,234,212,.12);
    }

    .actions{
      margin-top:18px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .button{
      border:none;
      border-radius:18px;
      padding:14px;

      font:inherit;
      font-weight:700;

      cursor:pointer;

      transition:.25s;
    }

    .button:hover{
      transform:translateY(-2px);
    }

    .button.primary{
      color:#04121f;

      background:
      linear-gradient(
      135deg,
      #5eead4,
      #22c55e
      );
    }

    .button.secondary{
      color:white;

      background:
      rgba(255,255,255,.08);

      border:1px solid rgba(255,255,255,.12);
    }

    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .stats{
      display:flex;
      gap:24px;
    }

    .stat{
      display:flex;
      flex-direction:column;
    }

    .stat span{
      font-size:.75rem;
      opacity:.65;
    }

    .stat strong{
      font-size:1rem;
      font-weight:700;
    }

    .status{
      font-size:.85rem;
      opacity:.75;
    }

    .leaflet-container{
      background:#09141f;
    }

    .leaflet-popup-content-wrapper{
      border-radius:18px;
      backdrop-filter:blur(20px);
    }

    @media(max-width:640px){

      .actions{
        grid-template-columns:1fr;
      }

      .title{
        font-size:1.6rem;
      }

      .footer{
        flex-direction:column;
        align-items:flex-start;
      }

      .stats{
        width:100%;
        justify-content:space-between;
      }
    }

  </style>
</head>
<body>

<div class="shell">

  <div id="map"></div>

  <div class="overlay">

    <div class="card">

      <div class="header">

        <div>

          <p class="eyebrow">
            📍 Seguimiento catastral
          </p>

          <h1 class="title">
            Mijares (Ávila)
          </h1>

          <p class="subtitle">
            Visualización geográfica en tiempo real mediante Leaflet.
          </p>

        </div>

        <div class="badge">
          Leaflet
        </div>

      </div>

      <div class="actions">

        <button
          id="locateBtn"
          class="button primary"
          type="button">
          Mi ubicación
        </button>

        <button
          id="resetBtn"
          class="button secondary"
          type="button">
          Volver
        </button>

      </div>

    </div>

    <div class="card footer">

      <div class="stats">

        <div class="stat">
          <span>Municipio</span>
          <strong>Mijares</strong>
        </div>

        <div class="stat">
          <span>Provincia</span>
          <strong>Ávila</strong>
        </div>

      </div>

      <div
        id="status"
        class="status">
        Inicializando mapa...
      </div>

    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const initialCenter = [40.2970, -4.8368];
const initialZoom = 18;

const status = document.getElementById('status');
const locateBtn = document.getElementById('locateBtn');
const resetBtn = document.getElementById('resetBtn');

const map = L.map('map',{
  zoomControl:true,
  preferCanvas:true
}).setView(initialCenter, initialZoom);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    maxZoom:20,
    attribution:'© OpenStreetMap & Carto'
  }
).addTo(map);

const marker = L.circleMarker(initialCenter,{
  radius:10,
  fillColor:"#5eead4",
  color:"#ffffff",
  weight:3,
  fillOpacity:1
}).addTo(map);

marker.bindPopup(`
  <b>Mijares (Ávila)</b><br>
  Centro inicial del mapa
`).openPopup();

let userMarker = null;

function setStatus(message){
  status.textContent = message;
}

setTimeout(() => {
  map.invalidateSize();
}, 200);

locateBtn.addEventListener('click', () => {

  if(!navigator.geolocation){
    setStatus('Geolocalización no soportada.');
    return;
  }

  setStatus('Buscando ubicación...');

  navigator.geolocation.getCurrentPosition(

    position => {

      const latlng = [
        position.coords.latitude,
        position.coords.longitude
      ];

      if(userMarker){
        map.removeLayer(userMarker);
      }

      userMarker = L.circleMarker(
        latlng,
        {
          radius:9,
          fillColor:"#22c55e",
          color:"#fff",
          weight:3,
          fillOpacity:1
        }
      ).addTo(map);

      userMarker.bindPopup(
        'Tu ubicación'
      ).openPopup();

      map.flyTo(latlng,16,{
        animate:true,
        duration:1.5
      });

      setStatus(
        `Ubicación encontrada`
      );
    },

    () => {
      setStatus(
        'No se pudo obtener la ubicación.'
      );
    },

    {
      enableHighAccuracy:true,
      timeout:8000,
      maximumAge:0
    }
  );

});

resetBtn.addEventListener('click', () => {

  map.flyTo(
    initialCenter,
    initialZoom,
    {
      animate:true,
      duration:1.5
    }
  );

  marker.openPopup();

  setStatus(
    'Mapa restaurado.'
  );
});

setStatus(
  'Mapa cargado correctamente.'
);

</script>

</body>
</html>
