<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mijares (Ávila)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    height:100%;
    font-family:Inter,sans-serif;
}

#map{
    width:100%;
    height:100vh;
}

/* BARRA SUPERIOR TIPO GOOGLE MAPS */

.top-bar{

    position:absolute;

    top:15px;
    left:50%;

    transform:translateX(-50%);

    width:min(440px,92vw);

    z-index:1001;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border:none;

    background:white;

    padding:14px 18px;

    border-radius:20px;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.12);

    transition:.25s;
}

.top-bar:hover{

    transform:
        translateX(-50%)
        translateY(-2px);
}

.top-bar-left{

    display:flex;

    align-items:center;

    gap:12px;

    text-align:left;
}

.pin{

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eef4ff;

    font-size:1.2rem;
}

.place-name{

    font-size:1rem;

    font-weight:700;

    color:#111827;
}

.place-subtitle{

    margin-top:2px;

    font-size:.80rem;

    color:#6b7280;
}

.arrow{

    color:#6b7280;

    font-size:14px;

    transition:.3s;
}

.arrow.rotate{

    transform:rotate(180deg);
}

/* PANEL INFO */

.info-panel{

    position:absolute;

    top:85px;
    left:50%;

    transform:translateX(-50%);

    width:min(440px,92vw);

    z-index:1000;

    background:white;

    border-radius:20px;

    padding:20px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.12);

    display:none;
}

.info-panel.show{
    display:block;
}

.info-panel h2{

    font-size:1.2rem;

    margin-bottom:10px;
}

.info-panel p{

    color:#555;

    line-height:1.6;
}

/* TARJETA INFERIOR */

.bottom-card{

    position:absolute;

    left:20px;
    bottom:20px;

    z-index:1000;

    background:white;

    border-radius:20px;

    padding:18px 22px;

    min-width:280px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.12);
}

.bottom-card h3{

    margin-bottom:6px;

    font-size:1.1rem;
}

.bottom-card span{

    color:#666;
}

.leaflet-popup-content-wrapper{
    border-radius:16px;
}

.leaflet-control-zoom{
    margin-top:80px !important;
}

@media(max-width:640px){

    .bottom-card{
        left:12px;
        right:12px;
        min-width:auto;
    }

    .top-bar{
        width:94vw;
    }

    .info-panel{
        width:94vw;
    }
}

</style>
</head>

<body>

<!-- BARRA SUPERIOR -->

<button
    id="toggleInfo"
    class="top-bar">

    <div class="top-bar-left">

        <div class="pin">
            📍
        </div>

        <div>

            <div class="place-name">
                Mijares (Ávila)
            </div>

            <div class="place-subtitle">
                Centro inicial del mapa
            </div>

        </div>

    </div>

    <span
        id="arrow"
        class="arrow">
        ▼
    </span>

</button>

<!-- PANEL DESPLEGABLE -->

<div
    id="infoPanel"
    class="info-panel">

    <h2>Mijares (Ávila)</h2>

    <p>
        Visualización geográfica del municipio utilizando
        Leaflet y OpenStreetMap.
    </p>

    <p style="margin-top:10px;">
        Puedes mover el mapa, cambiar el nivel de zoom y
        consultar la ubicación principal marcada.
    </p>

</div>

<!-- MAPA -->

<div id="map"></div>

<!-- TARJETA INFERIOR -->

<div class="bottom-card">

    <h3>Mijares (Ávila)</h3>

    <span>
        Mapa cargado correctamente.
    </span>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const initialCenter = [40.2970, -4.8368];
const initialZoom = 18;

const map = L.map('map').setView(
    initialCenter,
    initialZoom
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:20,
        attribution:'© OpenStreetMap'
    }
).addTo(map);

/* MARCADOR MODERNO */

L.circleMarker(initialCenter,{
    radius:10,
    fillColor:"#2563eb",
    color:"#ffffff",
    weight:3,
    fillOpacity:1
})
.addTo(map)
.bindPopup(
    '<b>Mijares 3 (Ávila)</b><br>Centro inicial del mapa'
)
.openPopup();

/* BARRA DESPLEGABLE */

const toggleBtn =
    document.getElementById('toggleInfo');

const infoPanel =
    document.getElementById('infoPanel');

const arrow =
    document.getElementById('arrow');

toggleBtn.addEventListener('click', () => {

    infoPanel.classList.toggle('show');

    arrow.classList.toggle('rotate');

});

</script>

</body>
</html>
