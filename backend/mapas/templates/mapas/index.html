<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mapa catastral</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #toolbar {
            height: 50px;
            padding: 8px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            box-sizing: border-box;
        }

        #municipio {
            width: 120px;
            padding: 4px;
        }

        #map {
            height: calc(100vh - 50px);
        }

        #estado {
            margin-left: 8px;
            font-size: 14px;
            color: #374151;
        }

        #estado.cargando {
            color: #1d4ed8;
            font-weight: 600;
        }

        button {
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div id="toolbar">

        <label for="municipio">
            Municipio:
        </label>

        <input
            id="municipio"
            type="text"
            maxlength="5"
            value="05127"
            placeholder="Código municipio"
        >

        <button id="btnCargar">
            Cargar municipio
        </button>

        <span id="estado"></span>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const map = L.map(
            "map",
            {
                preferCanvas: true
            }
        ).setView(
            [40.2970, -4.8368],
            18
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);

        let parcelasLayer = null;
        let ultimoMunicipioCargado = null;

        function setEstado(texto, cargando = false) {
            const estadoEl = document.getElementById("estado");
            estadoEl.textContent = texto;
            estadoEl.classList.toggle("cargando", cargando);
        }

        function cargarParcelas() {

            const municipio = document
                .getElementById("municipio")
                .value
                .trim();

            if (
                municipio.length !== 5 ||
                !/^\d+$/.test(municipio)
            ) {

                alert(
                    "Debe indicar un código de municipio válido de 5 dígitos."
                );

                return;

            }

            setEstado(
                `Cargando datos de Municipio ${municipio}...`,
                true
            );

            fetch(
                `/api/parcelas/?municipio=${municipio}`
            )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        `Error HTTP ${response.status}`
                    );

                }

                return response.json();

            })
            .then(data => {

                if (parcelasLayer) {

                    map.removeLayer(
                        parcelasLayer
                    );

                }

                parcelasLayer = L.geoJSON(
                    data,
                    {
                        renderer: L.canvas(),

                        style: {
                            color: "#1d4ed8",
                            weight: 1,
                            opacity: 0.95,
                            fillColor: "#1d4ed8",
                            fillOpacity: 0
                        },

                        onEachFeature(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                `
                                <b>Referencia:</b>
                                ${feature.properties.referencia}
                                <br>
                                <b>Municipio:</b>
                                ${feature.properties.municipio}
                                `
                            );

                        }

                    }
                ).addTo(map);

                if (
                    municipio !== ultimoMunicipioCargado &&
                    data.features.length > 0
                ) {
                    const bounds = parcelasLayer.getBounds();

                    if (bounds.isValid()) {
                        map.fitBounds(
                            bounds,
                            { maxZoom: 18 }
                        );
                    }
                }

                ultimoMunicipioCargado = municipio;

                console.log(
                    `Parcelas cargadas: ${data.features.length}`
                );

                setEstado(
                    `Municipio ${municipio}: ${data.features.length} parcelas cargadas.`
                );

            })
            .catch(error => {

                console.error(error);

                setEstado(
                    `Error cargando datos de Municipio ${municipio}.`
                );

                alert(
                    "Error cargando parcelas"
                );

            });

        }

        document
            .getElementById(
                "btnCargar"
            )
            .addEventListener(
                "click",
                cargarParcelas
            );

        document
            .getElementById(
                "municipio"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        cargarParcelas();

                    }

                }
            );

        // NO recargamos automáticamente
        // al mover o hacer zoom

        // map.on("moveend", cargarParcelas);
        // map.on("zoomend", cargarParcelas);

        cargarParcelas();

    </script>

</body>

</html>
