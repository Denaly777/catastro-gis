<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mapa catastral</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

    </style>

</head>
<body>

    <div id="toolbar">

        <label for="municipio">
            Municipio:
        </label>

        <input
            id="municipio"
            type="text"
            maxlength="5"
            value="05127"
            placeholder="Código municipio"
        >

        <button id="btnCargar">
            Cargar
        </button>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const map = L.map("map", {
            preferCanvas: true
        }).setView(
            [40.2970, -4.8368],
            18
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);

        let parcelasLayer = null;

        function cargarParcelas() {

            const municipio = document
                .getElementById("municipio")
                .value
                .trim();

            if (!municipio) {
                return;
            }

            const bounds = map.getBounds();
            const zoom = map.getZoom();

            const bbox = [
                bounds.getWest(),
                bounds.getSouth(),
                bounds.getEast(),
                bounds.getNorth()
            ].join(",");

            fetch(
                `/api/parcelas/?municipio=${municipio}&bbox=${encodeURIComponent(bbox)}&zoom=${zoom}`
            )
            .then(response => {

                if (!response.ok) {
                    throw new Error(
                        `Error HTTP ${response.status}`
                    );
                }

                return response.json();

            })
            .then(data => {

                if (parcelasLayer) {
                    map.removeLayer(parcelasLayer);
                }

                parcelasLayer = L.geoJSON(
                    data,
                    {
                        renderer: L.canvas(),

                        style: {
                            color: "#1d4ed8",
                            weight: 1,
                            opacity: 0.95,
                            fillColor: "#1d4ed8",
                            fillOpacity: 0
                        },

                        onEachFeature(feature, layer) {

                            layer.bindPopup(
                                feature.properties.referencia ||
                                "Sin referencia"
                            );

                        }
                    }
                ).addTo(map);

            })
            .catch(error => {

                console.error(error);

                alert(
                    "Error cargando parcelas"
                );

            });

        }

        document
            .getElementById("btnCargar")
            .addEventListener(
                "click",
                cargarParcelas
            );

        document
            .getElementById("municipio")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {
                        cargarParcelas();
                    }

                }
            );

        map.on("moveend", cargarParcelas);
        map.on("zoomend", cargarParcelas);

        cargarParcelas();

    </script>

</body>

</html>
