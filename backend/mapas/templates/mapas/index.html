<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mapa catastral</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #toolbar {
            height: 50px;
            padding: 8px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            box-sizing: border-box;
        }

        #municipio {
            width: 120px;
            padding: 4px;
        }

        #map {
            height: calc(100vh - 50px);
        }

        button {
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div id="toolbar">

        <label for="municipio">
            Municipio:
        </label>

        <input
            id="municipio"
            type="text"
            maxlength="5"
            value="05127"
            placeholder="Código municipio"
        >

        <button id="btnCargar">
            Cargar municipio
        </button>

        <button id="btnRefrescar">
            Refrescar parcelas visibles
        </button>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        const map = L.map(
            "map",
            {
                preferCanvas: true
            }
        ).setView(
            [40.2970, -4.8368],
            18
        );

        L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);

        let parcelasLayer = null;

        function cargarParcelas() {

            const municipio = document
                .getElementById("municipio")
                .value
                .trim();

            if (
                municipio.length !== 5 ||
                !/^\d+$/.test(municipio)
            ) {

                alert(
                    "Debe indicar un código de municipio válido de 5 dígitos."
                );

                return;

            }

            const bounds = map.getBounds();
            const zoom = map.getZoom();

            const bbox = [
                bounds.getWest(),
                bounds.getSouth(),
                bounds.getEast(),
                bounds.getNorth()
            ].join(",");

            console.log(
                "Cargando bbox:",
                bbox
            );

            fetch(
                `/api/parcelas/?municipio=${municipio}&bbox=${encodeURIComponent(bbox)}&zoom=${zoom}`
            )
            .then(response => {

                if (!response.ok) {

                    throw new Error(
                        `Error HTTP ${response.status}`
                    );

                }

                return response.json();

            })
            .then(data => {

                if (parcelasLayer) {

                    map.removeLayer(
                        parcelasLayer
                    );

                }

                parcelasLayer = L.geoJSON(
                    data,
                    {
                        renderer: L.canvas(),

                        style: {
                            color: "#1d4ed8",
                            weight: 1,
                            opacity: 0.95,
                            fillColor: "#1d4ed8",
                            fillOpacity: 0
                        },

                        onEachFeature(
                            feature,
                            layer
                        ) {

                            layer.bindPopup(
                                `
                                <b>Referencia:</b>
                                ${feature.properties.referencia}
                                <br>
                                <b>Municipio:</b>
                                ${feature.properties.municipio}
                                `
                            );

                        }

                    }
                ).addTo(map);

                console.log(
                    `Parcelas cargadas: ${data.features.length}`
                );

            })
            .catch(error => {

                console.error(error);

                alert(
                    "Error cargando parcelas"
                );

            });

        }

        document
            .getElementById(
                "btnCargar"
            )
            .addEventListener(
                "click",
                cargarParcelas
            );

        document
            .getElementById(
                "btnRefrescar"
            )
            .addEventListener(
                "click",
                cargarParcelas
            );

        document
            .getElementById(
                "municipio"
            )
            .addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter"
                    ) {

                        cargarParcelas();

                    }

                }
            );

        // NO recargamos automáticamente
        // al mover o hacer zoom

        // map.on("moveend", cargarParcelas);
        // map.on("zoomend", cargarParcelas);

        cargarParcelas();

    </script>

</body>

</html>
